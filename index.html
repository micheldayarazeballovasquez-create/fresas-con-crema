<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fresas con Crema - Catalogo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-fresa shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="./index.html">🍓 Dulce Fresa &amp; Crema</a>
      <div class="d-flex gap-2">
        <button class="btn btn-light text-danger fw-semibold position-relative" data-bs-toggle="modal" data-bs-target="#modalCarrito">
          🛒 Carrito
          <span id="contadorCarrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-dark">0</span>
        </button>
        <a href="./admin.html" class="btn btn-outline-light">Admin</a>
      </div>
    </div>
  </nav>

  <!-- Banner -->
  <header class="hero-banner py-4 text-center mb-4">
    <div class="container">
      <h1 class="fw-bold text-danger">Nuestras Fresas con Crema</h1>
      <p class="mb-0 text-muted">Elige tu combinacion favorita, agregala al carrito y disfruta al instante.</p>
    </div>
  </header>

  <!-- Filtros -->
  <main class="container mb-5">
    <div class="row g-3 mb-4 align-items-center">
      <div class="col-md-5">
        <input type="text" id="buscador" class="form-control" placeholder="Buscar producto por nombre...">
      </div>
      <div class="col-md-4">
        <select id="filtroCategoria" class="form-select">
          <option value="todas">Todas las categorias</option>
        </select>
      </div>
      <div class="col-md-3 text-md-end">
        <span id="totalMostrados" class="text-muted small">Cargando catalogo...</span>
      </div>
    </div>

    <!-- Contenedor de tarjetas -->
    <div id="contenedorProductos" class="row g-4"></div>
  </main>

  <!-- Modal Carrito -->
  <div class="modal fade" id="modalCarrito" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title">Tu Pedido</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="listaCarrito"></div>
          <div class="d-flex justify-content-between align-items-center border-top pt-3 mt-3">
            <h5 class="mb-0">Total a pagar:</h5>
            <h4 class="mb-0 text-danger fw-bold">Bs. <span id="totalCarrito">0.00</span></h4>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Seguir viendo</button>
          <button type="button" id="btnConfirmarCompra" class="btn btn-fresa fw-bold">Confirmar Compra (Descontar Stock)</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/tienda.js"></script>
</body>
</html>
